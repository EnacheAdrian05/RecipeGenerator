<div class="content">
    <h2>Make an account</h2>
    <form #registerForm="ngForm" (ngSubmit)="register(registerForm)">
        <label for="name">
            Username (max. 64 characters)
        </label>
        <input type="text" ngModel id="name" name="name" 
                required maxlength="64" placeholder="ex. John Smith"/>
        <label for="email">
            E-mail address 
        </label>
        <input type="email" ngModel id="email" name="email"
                required placeholder="ex. john.smith@email.com"/>
        <label for="password">
            Password (8-24 characters)
        </label>
        <input type="password" id="password" name="password"
            required ngModel
            minlength="8" maxlength="24"
            pattern="(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*\(\)_+\-=\[\]\{\};':&quot;\\\|,.<>\/?]).{8,24}"
            title="8-24 characters with at least one uppercase letter,
             one number, and one special character" />
        <label for="allergies">Allergies (optional)</label>
        <input type="search" id="allergies" list="allergies-list" name="allergies"
            placeholder="Start typing..." autocomplete="off"
            [value] = "allergyInput"
            (input)="onAllergyInput($event)"
            (change)="onAllergyInput($event)"
            (blur)="allergyInput = ''"/>
        <datalist id="allergies-list">
            @for (allergy of allergies; track allergy.name) {
                <option [value]="allergy.name"></option>
            }
        </datalist>
        <div id="chips">
            @for (allergy of selectedAllergies; track allergy.name) {
                <div class="chip" (click) = "removeAllergy(allergy)">
                    × {{allergy.name}}
                </div>
            }
        </div>
        <button class="submit" type="submit">
            Register
        </button>
    </form>
    <a routerLink="/login" class="auth-link">Already have an account?</a>
</div>
